<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%275146d8%27/%3E%3Ctext x=%2732%27 y=%2745%27 text-anchor=%27middle%27 font-size=%2740%27%3E📖%3C/text%3E%3C/svg%3E">
<title>Bible Chronology — Exact Source Order</title>
<style>
:root{
 --bg:#f5f7fb; --surface:#fff; --text:#172033; --muted:#667085; --line:#e4e7ec;
 --accent:#5146d8; --accent-dark:#4038c4; --accent-ring:#b9b6ec; --soft:#f0efff; --soft-text:#443db5;
 --danger:#b42318; --shadow:0 5px 20px rgba(16,24,40,.07);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:50;background:rgba(245,247,251,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.header-inner{max-width:1500px;margin:auto;padding:16px 22px}
.title{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:13px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:22px}
h1{margin:0;font-size:24px;letter-spacing:-.3px}
.subtitle{color:var(--muted);font-size:13px;margin-top:2px}

/* Scoped to the toolbar so it can never leak onto the audio controls. */
.toolbar{max-width:1500px;margin:auto;padding:10px 22px 14px;display:flex;gap:8px;flex-wrap:wrap}
.toolbar input,.toolbar select,.toolbar button{font:inherit;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--text);padding:10px 12px}
.toolbar input{flex:1;min-width:230px}
.toolbar button{cursor:pointer;font-weight:650}
.toolbar button:hover{border-color:var(--accent-ring)}
.toolbar button.active{background:var(--accent);color:#fff;border-color:var(--accent)}

main{max-width:1500px;margin:auto;padding:20px 22px 60px}
.status{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:17px}
.status strong{color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:17px;min-height:195px;box-shadow:var(--shadow);position:relative}
.card-num{position:absolute;right:15px;top:14px;font-size:12px;color:#98a2b3;font-weight:700}
.era{font-size:11px;text-transform:uppercase;letter-spacing:.45px;color:var(--muted);margin-bottom:7px}
.date{font-weight:800;font-size:13px;color:var(--accent);margin-bottom:7px}
.part{display:inline-block;background:var(--soft);color:var(--soft-text);padding:4px 8px;border-radius:999px;font-size:11px;font-weight:750;margin-bottom:9px}
.card-title{font-size:16px;font-weight:750;line-height:1.3;margin:0 34px 7px 0}
.event{color:#344054;margin:0 0 11px;line-height:1.4}
.ref{color:var(--accent);font-weight:750;font-size:14px}
a.ref{text-decoration:none} a.ref:hover{text-decoration:underline}
.list{display:none;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:55px 110px 170px minmax(220px,1fr) 180px 120px;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 13px}
.small{font-size:12px;color:var(--muted)}
.empty{display:none;text-align:center;padding:70px;color:var(--muted)}

/* ---- Chapter audio ---- */
.card-ref-row{display:flex;align-items:center;gap:10px;margin-top:2px}
.card-ref-row .ref{min-width:0;overflow-wrap:anywhere}
.card-audio{margin-top:12px}
.audio-area:empty{display:none}
.card-play-btn{flex:0 0 auto;margin-left:auto}
.card-play-btn,.row-play-btn{display:inline-flex;align-items:center;gap:6px;width:auto;padding:7px 12px 7px 10px;font:inherit;font-size:12px;font-weight:700;line-height:1;border:0;border-radius:999px;background:var(--accent);color:#fff;cursor:pointer}
.card-play-btn>span:first-child,.row-play-btn>span:first-child{font-size:9px;line-height:1}
.card-play-btn:hover,.row-play-btn:hover{background:var(--accent-dark)}
.card-play-btn:disabled,.row-play-btn:disabled{opacity:.7;cursor:wait}
.row-audio{grid-column:1/-1;margin-top:0}

.chapter-audio-wrap{border:1px solid var(--line);border-radius:16px;background:#fbfbfe;padding:12px;margin-top:10px}
.chapter-audio-label{display:flex;align-items:center;gap:6px;margin:0 0 10px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.18em;color:var(--muted)}
.chapter-audio-now{margin-left:2px;letter-spacing:.06em;color:var(--soft-text);text-transform:none;font-size:11px;font-weight:700}
.chapter-audio-row{display:flex;align-items:center;gap:12px;min-width:0}
.chapter-audio-play{flex:0 0 auto;display:grid;place-items:center;width:40px;height:40px;padding:0;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:13px;line-height:1;cursor:pointer}
.chapter-audio-play:hover{background:var(--accent-dark)}
.chapter-audio-main{flex:1 1 auto;min-width:0}

.chapter-audio-seek{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;height:6px;margin:0;padding:0;border:0;border-radius:999px;cursor:pointer;
 background:linear-gradient(90deg,var(--accent) var(--pct,0%),var(--line) var(--pct,0%))}
.chapter-audio-seek::-webkit-slider-runnable-track{height:6px;border-radius:999px;background:transparent}
.chapter-audio-seek::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-4px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 1px 3px rgba(16,24,40,.28)}
.chapter-audio-seek::-moz-range-track{height:6px;border-radius:999px;background:transparent}
.chapter-audio-seek::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid #fff}

.chapter-audio-times{display:flex;justify-content:space-between;margin-top:7px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.chapter-audio-side{flex:0 0 auto;display:flex;align-items:center;gap:8px}
.chapter-audio-auto{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 11px;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;font:inherit;font-size:11px;font-weight:600;white-space:nowrap;cursor:pointer}
.chapter-audio-auto:hover{border-color:var(--accent-ring)}
.chapter-audio-auto.on{background:var(--soft);color:var(--soft-text);border-color:var(--accent-ring)}
.chapter-audio-speed{height:30px;padding:0 9px;font:inherit;font-size:11px;font-weight:600;color:var(--text);border:1px solid var(--line);background:#fff;border-radius:999px;cursor:pointer}
.chapter-audio-speed:hover{border-color:var(--accent-ring)}
.chapter-audio-error{margin-top:9px;font-size:11px;color:var(--danger)}

.chapter-selector{display:flex;gap:6px;margin-top:10px;padding-bottom:2px;overflow-x:auto;scrollbar-width:thin}
.chapter-btn{flex:0 0 auto;font:inherit;font-size:11px;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:9px;padding:6px 10px;cursor:pointer}
.chapter-btn:hover{border-color:var(--accent-ring);color:var(--soft-text)}
.chapter-btn.active{background:var(--soft);color:var(--soft-text);border-color:var(--accent-ring)}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

@media(max-width:760px){
 .header-inner,.toolbar,main{padding-left:12px;padding-right:12px}
 h1{font-size:20px}
 .grid{grid-template-columns:1fr}
 .row{grid-template-columns:42px 1fr} .row>*:nth-child(n+3){grid-column:2}
 .toolbar input{min-width:150px}
 .auto-label{display:none}
 .chapter-audio-row{gap:10px}
}
</style>
</head><body>
<header>
 <div class="header-inner">

 </div>

  <select id="sort">
   <option value="chron">Exact chronological order</option>
   <option value="part">Group by Part</option>
   <option value="title">Group by Part-Title</option>
   <option value="book">Group by Bible book</option>
   <option value="date">Group by Date</option>
  </select>
  <button id="tiles" class="active">▦ Tiles</button>
  <button id="list">☷ List</button>
 </div>
</header>
<main>
 <div class="status"><strong id="count">Loading…</strong><span>•</span><span>Master order # is never changed</span></div>
 <section id="grid" class="grid"></section>

</main>

function audioItems(r){
 return sourcesOf(r).map(src=>{
  const m=src.match(/sajeevavahini\.com\/bible\/[^/]+\/([^/]+)\/(\d+)\/?$/i);
  if(!m) return null;
  const bookNum=BOOK_NUM[m[1].toLowerCase()];
  if(!bookNum) return null;
  const chapter=Number(m[2]);
  return {chapter,url:AUDIO_BASE+bookNum+"/"+chapter+".mp3"};
 }).filter(Boolean);
}
function bookOf(r){const m=r.Reference.match(/^((?:[1-3] )?[A-Za-z]+(?: [A-Za-z]+)?)/);return m?m[1]:""}

// Derived once, not on every keystroke — one reference spans 150 chapters.
const AUDIO=new Map(DATA.map(r=>[r["#"],audioItems(r)]));
const BOOK=new Map(DATA.map(r=>[r["#"],bookOf(r)]));
const HAYSTACK=new Map(DATA.map(r=>[r["#"],[r.Date,r.Period,r.Part,r["Part-Title"],r.Event,r.Reference].join(" ").toLowerCase()]));

let view="tiles";
let playing=null;
let continuous=true;          // keep rolling: next chapter, then next event
let ORDER=[];                 // ids with audio, in the order currently on screen
const PLAYERS=new Map();      // id -> player controller, cleared on every render

function filtered(){
 const q=$("search").value.trim().toLowerCase(), p=$("period").value, mode=$("sort").value;
 const a=DATA.filter(r=>(!p||r.Period===p)&&(!q||HAYSTACK.get(r["#"]).includes(q)));
 const byNum=(x,y)=>Number(x["#"])-Number(y["#"]);
 if(mode==="part") a.sort((x,y)=>Number(x.Part)-Number(y.Part)||byNum(x,y));
 else if(mode==="title") a.sort((x,y)=>x["Part-Title"].localeCompare(y["Part-Title"])||byNum(x,y));
 else if(mode==="book") a.sort((x,y)=>BOOK.get(x["#"]).localeCompare(BOOK.get(y["#"]))||byNum(x,y));
 else if(mode==="date") a.sort((x,y)=>x.Date.localeCompare(y.Date)||byNum(x,y));
 else a.sort(byNum);
 return a;
}

function refHTML(r){
 const first=sourcesOf(r)[0];
 const label="📖 "+esc(r.Reference);
 return first
  ? `<a class="ref" href="${esc(first)}" target="_blank" rel="noopener noreferrer">${label}</a>`
  : `<div class="ref">${label}</div>`;
}

function card(r){
 const id=esc(r["#"]), hasAudio=AUDIO.get(r["#"]).length;
 return `<article class="card" data-id="${id}">
  <span class="card-num">#${id}</span>
  <div class="era">${esc(r.Period)}</div><div class="date">${esc(r.Date)}</div>
  <span class="part">Part ${esc(r.Part)} · ${esc(r["Part-Title"])}</span>
  <h2 class="card-title">${esc(r.Event)}</h2><p class="event">${esc(r.Reference)}</p>
  <div class="card-ref-row">${refHTML(r)}${hasAudio?`<button type="button" class="card-play-btn" data-play="${id}" title="Play chapter audio"><span>▶</span> Audio</button>`:""}</div>
  ${hasAudio?`<div class="card-audio audio-area"></div>`:""}
 </article>`;
}

function row(r){
 const id=esc(r["#"]), hasAudio=AUDIO.get(r["#"]).length;
 return `<div class="row" data-id="${id}">
  <b>#${id}</b>
  <div class="small">${esc(r.Date)}</div>
  <div class="small">${esc(r.Period)}<br>Part ${esc(r.Part)}</div>
  <div><b>${esc(r.Event)}</b><br><span class="small">${esc(r["Part-Title"])}</span></div>
  ${refHTML(r)}
  <div>${hasAudio?`<button type="button" class="row-play-btn" data-play="${id}" title="Play chapter audio"><span>▶</span> Audio</button>`:""}</div>
  <div class="card-audio audio-area row-audio"></div>
 </div>`;
}

function playerHTML(items){
 return `<div class="chapter-audio-wrap">
  <div class="chapter-audio-label">🎧 Chapter Audio${items.length>1?` <span class="chapter-audio-now">Chapter ${items[0].chapter} of ${items[items.length-1].chapter}</span>`:""}</div>
  <audio class="chapter-audio-element" preload="metadata" src="${esc(items[0].url)}"></audio>
  <div class="chapter-audio-row">
   <button type="button" class="chapter-audio-play" title="Play" aria-label="Play"><span>▶</span></button>
   <div class="chapter-audio-main">
    <input type="range" min="0" max="0" step="0.1" value="0" class="chapter-audio-seek" aria-label="Seek">
    <div class="chapter-audio-times"><span class="chapter-audio-current">0:00</span><span class="chapter-audio-duration">--:--</span></div>
   </div>
   <div class="chapter-audio-side">
    <button type="button" class="chapter-audio-auto" aria-pressed="true" title="Keep playing the next chapter, then the next event"><span aria-hidden="true">⟳</span><span class="auto-label">Continuous</span></button>
    <select class="chapter-audio-speed" title="Playback speed" aria-label="Playback speed"><option value="0.8">0.8x</option><option value="1" selected>1x</option><option value="1.2">1.2x</option><option value="1.5">1.5x</option><option value="2">2x</option></select>
   </div>
  </div>
  <div class="chapter-audio-error" hidden></div>
  ${items.length>1?`<div class="chapter-selector">${items.map((x,i)=>`<button type="button" class="chapter-btn${i===0?" active":""}" data-index="${i}">Ch ${x.chapter}</button>`).join("")}</div>`:""}
 </div>`;
}

function attachPlayer(area,items,id){
 area.innerHTML=playerHTML(items);
 const audio=area.querySelector(".chapter-audio-element"),
       play=area.querySelector(".chapter-audio-play"),
       seek=area.querySelector(".chapter-audio-seek"),
       cur=area.querySelector(".chapter-audio-current"),
       dur=area.querySelector(".chapter-audio-duration"),
       speed=area.querySelector(".chapter-audio-speed"),
       auto=area.querySelector(".chapter-audio-auto"),
       err=area.querySelector(".chapter-audio-error");

 const paint=()=>{const d=audio.duration;seek.style.setProperty("--pct",(d&&Number.isFinite(d)?(seek.value/d)*100:0)+"%")};
 paint();
 audio.addEventListener("loadedmetadata",()=>{seek.max=audio.duration||0;dur.textContent=formatTime(audio.duration);audio.playbackRate=Number(speed.value);err.hidden=true;paint()});
 audio.addEventListener("timeupdate",()=>{seek.value=audio.currentTime||0;cur.textContent=formatTime(audio.currentTime);paint()});
 audio.addEventListener("play",()=>{
  if(playing&&playing!==audio) playing.pause();
  playing=audio;
  play.innerHTML="<span>❚❚</span>";play.title="Pause";play.setAttribute("aria-label","Pause");
 });
 audio.addEventListener("pause",()=>{play.innerHTML="<span>▶</span>";play.title="Play";play.setAttribute("aria-label","Play")});
 audio.addEventListener("error",()=>{err.textContent="This chapter's audio could not be loaded. Check your connection and try again.";err.hidden=false});

 const chips=[...area.querySelectorAll(".chapter-btn")],
       strip=area.querySelector(".chapter-selector"),
       now=area.querySelector(".chapter-audio-now");
 let index=0;

 function loadChapter(i,autoplay){
  if(i<0||i>=items.length) return;
  index=i;
  chips.forEach((b,n)=>b.classList.toggle("active",n===i));
  if(now) now.textContent="Chapter "+items[i].chapter+" of "+items[items.length-1].chapter;
  if(strip&&chips[i]) strip.scrollLeft=chips[i].offsetLeft-strip.clientWidth/2+chips[i].offsetWidth/2;
  err.hidden=true;
  seek.value=0;seek.max=0;cur.textContent="0:00";dur.textContent="--:--";paint();
  audio.src=items[i].url;audio.playbackRate=Number(speed.value);audio.load();
  if(autoplay!==false) safePlay(audio);
 }

 // Roll into the next chapter, then into the next event on screen.
 audio.addEventListener("ended",()=>{
  if(index+1<items.length){loadChapter(index+1,true);return}
  paint();
  if(continuous) startRecord(nextRecordId(id));
 });

 syncAuto(auto);
 auto.addEventListener("click",()=>{continuous=!continuous;syncAuto()});

 PLAYERS.set(id,{loadChapter});

 play.addEventListener("click",()=>audio.paused?safePlay(audio):audio.pause());
 seek.addEventListener("input",()=>{audio.currentTime=Number(seek.value);paint()});
 speed.addEventListener("change",()=>{audio.playbackRate=Number(speed.value)});
 chips.forEach(btn=>btn.addEventListener("click",()=>loadChapter(Number(btn.dataset.index),true)));

 audio.load();
 safePlay(audio);
}

// One delegated listener survives every re-render.
function syncAuto(one){
 const targets=one?[one]:[...document.querySelectorAll(".chapter-audio-auto")];
 targets.forEach(b=>{b.classList.toggle("on",continuous);b.setAttribute("aria-pressed",String(continuous))});
}

function nextRecordId(id){
 const i=ORDER.indexOf(id);
 return i>-1?ORDER[i+1]:undefined;
}

// Opens (or restarts) a record's player and plays it from chapter 1.
function startRecord(id){
 if(!id) return false;
 const host=(view==="tiles"?$("grid"):$("listView")).querySelector(`[data-id="${id}"]`);
 if(!host) return false;
 host.scrollIntoView({behavior:"smooth",block:"center"});
 const existing=PLAYERS.get(id);
 if(existing){existing.loadChapter(0,true);return true}
 const items=AUDIO.get(id);
 if(!items||!items.length) return false;
 const btn=host.querySelector("[data-play]");
 if(btn){btn.disabled=true;btn.hidden=true}
 attachPlayer(host.querySelector(".audio-area"),items,id);
 return true;
}

function onPlayClick(e){
 const btn=e.target.closest("[data-play]");
 if(!btn) return;
 const id=btn.dataset.play, items=AUDIO.get(id);
 if(!items||!items.length) return;
 btn.disabled=true;btn.innerHTML="<span>…</span> Loading…";
 attachPlayer(btn.closest(".card, .row").querySelector(".audio-area"),items,id);
 btn.hidden=true;
}
$("grid").addEventListener("click",onPlayClick);
$("listView").addEventListener("click",onPlayClick);

function render(){
 if(playing){playing.pause();playing=null}
 PLAYERS.clear();
 const a=filtered();
 ORDER=a.filter(r=>AUDIO.get(r["#"]).length).map(r=>r["#"]);
 $("count").textContent=a.length+(a.length===1?" event":" events");
 $("grid").innerHTML=a.map(card).join("");
 $("listView").innerHTML=a.map(row).join("");
 $("grid").style.display=view==="tiles"?"grid":"none";
 $("listView").style.display=view==="list"?"flex":"none";
 $("empty").style.display=a.length?"none":"block";
}

$("search").oninput=render; $("period").onchange=render; $("sort").onchange=render;
$("tiles").onclick=()=>{view="tiles";$("tiles").classList.add("active");$("list").classList.remove("active");render()};
$("list").onclick=()=>{view="list";$("list").classList.add("active");$("tiles").classList.remove("active");render()};
render();
</script>
</body></html>
