<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2715%27%20fill%3D%27%235146d8%27%2F%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%23fff%27%20stroke-width%3D%273.4%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%3E%3Cpath%20d%3D%27M32%2021c-3.9-3.1-8.3-4.3-12.7-4.3H16v27.6h3.9c4.5%200%208.6%201.2%2012.1%203.5%27%2F%3E%3Cpath%20d%3D%27M32%2021c3.9-3.1%208.3-4.3%2012.7-4.3H48v27.6h-3.9c-4.5%200-8.6%201.2-12.1%203.5%27%2F%3E%3Cpath%20d%3D%27M32%2021v26.8%27%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<title>Bible Chronology — Listening Console</title>
<!--
  Player layout inspired by Muhammed Erdem's "Mini Music Player" pen
  (codepen.io/JavaScriptJunkie/pen/qBWrRyg), itself based on a Dribbble
  design by Voicu Apostol. Written from scratch here — no code reused.
  Audio: Sajeeva Vahini Telugu Audio Bible.
-->
<style>
:root{
 --bg:#e6eaf2; --panel:#f4f7fb; --surface:#fff;
 --ink:#1d2536; --muted:#71829e; --line:#dde4ee;
 --accent:#5146d8; --accent-dark:#4038c4; --accent-ring:#b9b6ec; --soft:#eceaff; --soft-ink:#443db5;
 --sans:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
 --lift:0 18px 40px -14px rgba(50,74,130,.42);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

.hero{position:relative;isolation:isolate;overflow:hidden;color:#fff;
 background:linear-gradient(118deg,#241d63 0%,#3d33a8 38%,#5146d8 68%,#7a6ce6 100%)}
.hero::before{content:"";position:absolute;inset:-70% -15% auto;height:420px;z-index:-1;
 background:radial-gradient(52% 58% at 26% 100%,rgba(255,255,255,.26),transparent 68%)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:96px;pointer-events:none;
 background:linear-gradient(180deg,rgba(230,234,242,0) 0%,rgba(230,234,242,.55) 58%,var(--bg) 100%)}
.hero-inner{max-width:1320px;margin:auto;padding:40px 24px 62px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.sticky-player{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;gap:12px;
 padding:9px 20px;background:#1d2536;color:#fff;box-shadow:0 6px 18px -6px rgba(20,20,40,.5);
 transform:translateY(-100%);opacity:0;transition:transform .25s ease,opacity .25s ease;pointer-events:none}
.sticky-player.show{transform:translateY(0);opacity:1;pointer-events:auto}
.sp-swatch{width:8px;height:34px;border-radius:4px;flex:0 0 auto;background:var(--accent)}
.sticky-player button{background:none;border:none;color:#fff;cursor:pointer;padding:5px;line-height:1;
 opacity:.85;transition:opacity .15s,transform .15s;flex:0 0 auto}
.sticky-player button:hover{opacity:1;transform:scale(1.08)}
.sp-play{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.14);
 border:1px solid rgba(255,255,255,.28)!important;display:flex;align-items:center;justify-content:center}
.sp-text{flex:1;min-width:0;overflow:hidden}
.sp-title{font-family:var(--serif);font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-sub{font-size:11px;color:rgba(255,255,255,.65);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-bar{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.15)}
.sp-fill{height:100%;width:0%;background:var(--accent-ring)}
.hero-mark{flex:0 0 auto;width:52px;height:52px;display:grid;place-items:center;border-radius:15px;
 background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(6px)}
.hero-mark svg{width:27px;height:27px}
.hero-text{min-width:0}
.hero h1{margin:0;font-family:var(--serif);font-weight:600;font-size:clamp(28px,4.4vw,40px);
 line-height:1.04;letter-spacing:-.022em}
.hero p{margin:7px 0 0;font-size:13.5px;line-height:1.5;color:rgba(255,255,255,.76);max-width:46ch}
.hero-nav{flex:0 0 auto}
.hero-actions{margin-left:auto;display:flex;gap:8px;flex:0 0 auto}
.hero-nav a{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:#fff;text-decoration:none;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.32);border-radius:99px;padding:9px 15px;backdrop-filter:blur(6px);transition:background .2s,transform .2s;white-space:nowrap}
.hero-nav a:hover{background:rgba(255,255,255,.24);transform:translateY(-1px)}
.hero-lang{font-size:12.5px;font-weight:600;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.32);border-radius:99px;padding:9px 12px;backdrop-filter:blur(6px);cursor:pointer}
.hero-lang option{color:#1d2536;background:#fff}

.app{max-width:1320px;margin:auto;padding:4px 24px 56px;display:grid;grid-template-columns:392px minmax(0,1fr);gap:26px;align-items:start}

/* ---------- console ---------- */
.console{position:sticky;top:18px;display:flex;flex-direction:column;gap:14px}
.player{background:var(--panel);border-radius:20px;padding:26px 26px 22px;box-shadow:var(--lift)}
.player-top{display:flex;align-items:flex-start;gap:16px}

.cover{position:relative;width:216px;height:216px;flex:0 0 auto;margin-left:-58px;border-radius:16px}
.cover::before{content:"";position:absolute;inset:0;border-radius:16px;background:var(--cover,linear-gradient(140deg,#4036a8,#7b6fe0));transform:translateY(20px) scale(.9);filter:blur(13px);opacity:.75}
.cover-art{position:absolute;inset:0;border-radius:16px;background:var(--cover,linear-gradient(140deg,#4036a8,#7b6fe0));color:#fff;padding:18px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 10px 30px -8px rgba(53,44,124,.55);transition:opacity .34s ease,transform .34s ease}
.cover-art.swap{opacity:0;transform:scale(.94)}
.cover-part{font-size:10px;font-weight:700;letter-spacing:.16em;opacity:.78}
.cover-book{font-family:var(--serif);font-size:23px;line-height:1.15;text-shadow:0 2px 10px rgba(30,22,80,.35);cursor:pointer}
.cover-ch{font-family:var(--serif);font-size:58px;line-height:.95;letter-spacing:-.02em}
.cover-ch small{font-size:15px;opacity:.75;letter-spacing:.04em}

.rail{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding-left:4px}
.rail button{position:relative;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:#a8b3c9;font-size:17px;transition:color .25s,background .25s,transform .25s}
.rail button:hover{color:var(--accent);background:var(--surface);box-shadow:0 6px 14px -6px rgba(76,70,124,.35)}
.rail button.on{color:var(--accent);background:var(--soft)}
.rail .big{width:78px;height:78px;margin-top:4px;font-size:34px;color:#fff;background:var(--accent);box-shadow:0 14px 26px -8px rgba(81,70,216,.75)}
.rail .big:hover{background:var(--accent-dark);color:#fff;transform:translateY(-1px)}

.now{margin-top:20px;display:flex;align-items:flex-end;gap:14px}
.now-text{flex:1;min-width:0}
.now-event{font-family:var(--serif);font-size:19px;line-height:1.3;margin-bottom:5px}
.now-sub{font-size:13px;color:var(--muted);line-height:1.4}
.now-dur{font-size:17px;font-weight:700;color:var(--muted);opacity:.6;font-variant-numeric:tabular-nums}

.bar{margin-top:14px;height:7px;border-radius:99px;background:#d4dcea;cursor:pointer;position:relative;touch-action:none}
.bar-fill{height:100%;width:0;border-radius:99px;background:var(--accent);position:relative}
.bar-fill::after{content:"";position:absolute;right:-6px;top:50%;width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid var(--accent);transform:translateY(-50%);box-shadow:0 2px 6px rgba(40,50,90,.3);transition:transform .15s,width .15s,height .15s}
.bar.dragging .bar-fill::after{width:17px;height:17px;right:-8px;transform:translateY(-50%) scale(1.05)}
.bar-foot{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar-tools{display:flex;gap:6px}
.chip-speed{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 9px;font-size:11px;font-weight:600;color:var(--ink);cursor:pointer}
.vol-control{display:flex;align-items:center}
.vol-wrap{position:relative;width:56px;height:56px;cursor:pointer;touch-action:none}
.vol-label{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:4px;
 font-size:10px;font-weight:700;color:#fff;background:rgba(29,37,54,.85);border-radius:6px;padding:2px 6px;
 opacity:0;pointer-events:none;transition:opacity .15s;white-space:nowrap;z-index:5}
.vol-wrap.show-label .vol-label{opacity:1}
.vol-tick{position:absolute;inset:0}
.vol-tick::after{content:"";position:absolute;top:0;left:50%;width:2.5px;height:6px;margin-left:-1.25px;
 border-radius:1px;background:var(--line);transition:background .12s,box-shadow .12s}
.vol-tick.on::after{background:var(--accent);box-shadow:0 0 4px rgba(81,70,216,.6)}
.vol-dial{position:absolute;left:8px;top:8px;width:40px;height:40px;border-radius:50%;
 background:linear-gradient(140deg,var(--surface),var(--panel));border:1px solid var(--line);
 box-shadow:0 1px 4px rgba(30,22,80,.18)}
.vol-dial::after{content:"";position:absolute;top:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;
 border-radius:50%;background:var(--accent)}
.vol-icon{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:18px;height:18px;
 display:flex;align-items:center;justify-content:center;color:var(--muted);pointer-events:none}
.upnext{margin-top:14px;padding-top:13px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.45}
.upnext b{color:var(--ink);font-weight:650}
.err{margin-top:10px;font-size:12px;color:#b42318}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 13px}
.stat b{display:block;font-size:17px;letter-spacing:-.3px}
.stat span{font-size:11px;color:var(--muted)}

/* ---------- library ---------- */
.library{min-width:0}
.tools{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.tools input,.tools select{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px 13px}
.tools input{flex:1;min-width:190px}
.tools input:hover,.tools select:hover{border-color:var(--accent-ring)}
.count{font-size:13px;color:var(--muted);margin:0 0 12px}
.count b{color:var(--ink)}

.queue{display:flex;flex-direction:column;gap:7px}
.q{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:13px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:3px solid transparent;border-radius:14px;padding:12px 14px;transition:border-color .18s,transform .18s}
.q:hover{border-color:var(--accent-ring)}
.q-num{font-size:12px;font-weight:700;color:#a3aec2;font-variant-numeric:tabular-nums}
.q-title{font-family:var(--serif);font-size:15px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q-meta{font-size:12px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q-go{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:var(--accent);background:var(--soft)}
.q.playing{border-left-color:var(--accent);background:linear-gradient(90deg,var(--soft),var(--surface) 55%)}
.q.playing .q-num{color:var(--accent)}
.q.playing .q-go{background:var(--accent);color:#fff}
.none{display:none;padding:56px;text-align:center;color:var(--muted)}
.book-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 4px 6px;margin-top:4px}
.book-head:first-child{margin-top:0}
.book-head-name{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--ink);cursor:pointer}
.book-head-name:hover{color:var(--accent)}
.book-chip{font-size:11px;font-weight:700;color:var(--soft-ink);background:var(--soft);border-radius:99px;padding:4px 10px;white-space:nowrap;cursor:pointer}
.book-chip.done{color:#fff;background:var(--accent)}
.book-head{cursor:pointer;user-select:none}
.book-head-chevron{display:inline-block;font-size:11px;color:var(--muted);margin-right:6px;transition:transform .18s}
.book-head.open .book-head-chevron{transform:rotate(90deg)}
.book-tl{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:2px 0 8px}
.book-tl-meta{font-size:11.5px;color:var(--muted);margin-bottom:10px}
.book-tl-loading{font-size:12.5px;color:var(--muted);padding:4px 0}
.book-tl-axis{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.book-tl-row{padding:6px 0}
.book-tl-row-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.book-tl-name{font-family:var(--serif);font-size:12.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.book-tl-date{font-size:10.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.book-tl-track{position:relative;height:7px;border-radius:99px;background:var(--line)}
.book-tl-bar{position:absolute;top:0;height:100%;border-radius:99px;background:var(--accent)}
.book-tl-chip{position:absolute;left:0;top:50%;transform:translateY(-50%);font-size:9.5px;color:#8a93a6;background:#e7e9ef;border:1px solid #d3d7e0;border-radius:99px;padding:2px 8px;white-space:nowrap}

@media(max-width:1000px){
 .app{grid-template-columns:1fr;gap:20px;padding:4px 14px 48px}
 .hero-inner{padding:30px 14px 52px;gap:14px}
 .hero-mark{width:44px;height:44px;border-radius:13px}
 .hero-mark svg{width:23px;height:23px}
 .console{position:static}
 .player{padding:20px}
 .player-top{flex-wrap:wrap;justify-content:center}
 .cover{margin:-52px auto 14px;width:190px;height:190px}
 .rail{flex-direction:row;width:100%;padding-left:0;gap:6px}
 .rail .big{margin-top:0;margin-left:auto;width:66px;height:66px;font-size:28px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>

<header class="hero">
  <div class="hero-inner">
    <span class="hero-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.45"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 6.6C10.5 5.3 8.6 4.6 6.4 4.6H3.6v12.9h3.1c2.1 0 3.9.6 5.3 1.7"/>
        <path d="M12 6.6c1.5-1.3 3.4-2 5.6-2h2.8v12.9h-3.1c-2.1 0-3.9.6-5.3 1.7"/>
        <path d="M12 6.6v12.6"/>
      </svg>
    </span>
    <div class="hero-text">
      <h1>Bible Chronology</h1>
      <p>Two hundred and thirty-six events, in order</p>
    </div>
    <div class="hero-actions">
     <nav class="hero-nav"><a href="timeline.html">Timeline chart →</a></nav>
     <select id="uiLang" class="hero-lang" title="Interface language" aria-label="Interface language">
      <option value="en" selected>English</option>
      <option value="te">తెలుగు</option>
      <option value="hi">हिन्दी</option>
     </select>
    </div>
  </div>
</header>

<div class="sticky-player" id="stickyPlayer">
 <div class="sp-swatch" id="spSwatch"></div>
 <button id="spPrev" title="Previous chapter"></button>
 <button id="spPlay" class="sp-play" title="Play" aria-label="Play"></button>
 <button id="spNext" title="Next chapter"></button>
 <div class="sp-text">
  <div class="sp-title" id="spTitle">Nothing queued</div>
  <div class="sp-sub" id="spSub"></div>
 </div>
 <div class="sp-bar" id="spBar"><div class="sp-fill" id="spFill"></div></div>
</div>

<div class="app">
 <aside class="console">
  <section class="player">
   <div class="player-top">
    <div class="cover" id="cover">
     <div class="cover-art" id="coverArt">
      <div class="cover-part" id="coverPart">PART 1</div>
      <div>
       <div class="cover-book" id="coverBook">Genesis</div>
       <div class="cover-ch" id="coverCh">1</div>
      </div>
     </div>
    </div>
    <div class="rail">
     <button id="btnAuto" class="on" title="Continuous play" aria-pressed="true"></button>
     <button id="btnLink" title="Open this chapter on Sajeeva Vahini"></button>
     <button id="btnPrev" title="Previous chapter"></button>
     <button id="btnNext" title="Next chapter"></button>
     <button id="btnPop" title="Pop out player" hidden></button>
     <div class="vol-control">
      <input type="range" id="volume" min="0" max="1" step="0.01" value="1" hidden>
      <div class="vol-wrap" id="volWrap">
       <span class="vol-label" id="volLabel">100%</span>
       <div class="vol-dial-wrap" id="volDialWrap">
        <div class="vol-dial" id="volDial"></div><span class="vol-icon" id="volIcon"></span>
       </div>
      </div>
     </div>
     <button id="btnPlay" class="big" title="Play" aria-label="Play"></button>
    </div>
   </div>

   <div class="now">
    <div class="now-text">
     <div class="now-event" id="nowEvent">Nothing queued</div>
     <div class="now-sub" id="nowSub">Pick an event from the list</div>
    </div>
    <div class="now-dur" id="nowDur">--:--</div>
   </div>

   <div class="bar" id="bar"><div class="bar-fill" id="barFill"></div></div>
   <div class="bar-foot">
    <span id="nowTime">0:00</span>
    <div class="bar-tools">
     <select class="chip-speed" id="version" title="Audio version" aria-label="Audio version">
      <option value="telugu">Telugu</option>
      <option value="hindi">Hindi</option>
      <option value="esv">ESV (English)</option>
      <option value="nlt" selected>NLT (English)</option>
     </select>
     <select class="chip-speed" id="speed" title="Playback speed" aria-label="Playback speed">
      <option value="0.8">0.8x</option><option value="1" selected>1x</option>
      <option value="1.2">1.2x</option><option value="1.5">1.5x</option><option value="2">2x</option>
     </select>
    </div>
   </div>
   <div class="upnext" id="upnext">Up next — nothing queued</div>
   <div class="err" id="err" hidden></div>
  </section>

  <div class="stats">
   <div class="stat"><b id="statEvents">0</b><span>events</span></div>
   <div class="stat"><b id="statCh">0</b><span>chapters</span></div>
   <div class="stat"><b id="statPos">—</b><span>position</span></div>
  </div>
 </aside>

 <main class="library">
  <div class="tools">
   <input id="search" type="search" placeholder="Search event, reference, date…">
   <select id="period"><option value="">All periods</option><option value="Old Testament">Old Testament</option><option value="New Testament">New Testament</option></select>
   <select id="sort">
    <option value="canon">Canonical order</option>
    <option value="chron">Chronological order</option>
    <option value="part">By Part</option>
    <option value="title">By Part-Title</option>
    <option value="book">By Bible book</option>
    <option value="date">By Date</option>
   </select>
  </div>
  <p class="count"><b id="count">0 events</b> · <span id="countCh">0 chapters</span><span id="inQueueText"> in the queue</span></p>
  <div class="queue" id="queue"></div>
  <div class="none" id="none">No matching events.</div>
 </main>

/* ---------------- mobile fallback: canvas-drawn "video" so we can use the video-element
   Picture-in-Picture API, which — unlike Document PiP — actually works on phones (iOS Safari,
   Chrome Android) and floats over other apps, not just other tabs. It never touches the real
   <audio> element, so there's no risk to playback: it's a second, silent, purely visual stream.
   The floating window's native tap controls route through the mediaSession handlers already
   registered above, which drive real playback. */
let mobilePipCanvas=null, mobilePipCtx=null, mobilePipVideo=null, mobilePipTimer=null, mobilePipTrack=null;
function ensureMobilePipVideo(){
 if(mobilePipVideo) return mobilePipVideo;
 mobilePipCanvas=document.createElement("canvas");
 mobilePipCanvas.width=480; mobilePipCanvas.height=270;
 mobilePipCanvas.style.cssText="position:fixed;left:-9999px;top:-9999px";
 document.body.appendChild(mobilePipCanvas); // captureStream() is unreliable on a detached canvas in some browsers
 mobilePipCtx=mobilePipCanvas.getContext("2d");
 drawMobilePipFrame();
 const stream=mobilePipCanvas.captureStream(6);
 mobilePipTrack=stream.getVideoTracks()[0];
 mobilePipVideo=document.createElement("video");
 mobilePipVideo.muted=true; mobilePipVideo.playsInline=true; mobilePipVideo.setAttribute("webkit-playsinline","");
 mobilePipVideo.width=480; mobilePipVideo.height=270;
 mobilePipVideo.srcObject=stream;
 // Off-screen with real dimensions, NOT opacity:0/1x1 — some mobile browsers stop decoding frames for
 // elements they consider invisible, which is exactly what showed up as a blank black/gray PiP window.
 mobilePipVideo.style.cssText="position:fixed;left:-9999px;top:-9999px;width:480px;height:270px";
 document.body.appendChild(mobilePipVideo);
 // Keep frames flowing continuously (not just once PiP opens) — captureStream() on some browsers only
 // reliably pushes a new frame when the canvas is actually redrawn, so a single static draw can end up
 // stale or never get delivered before the PiP window opens.
 if(mobilePipTimer) clearInterval(mobilePipTimer);
 mobilePipTimer=setInterval(drawMobilePipFrame,500);

}
function waitForVideoReady(v){

  if(v.readyState>=2) return resolve(); // HAVE_CURRENT_DATA — enough for PiP
  const onReady=()=>{ v.removeEventListener("loadeddata",onReady); resolve(); };
  v.addEventListener("loadeddata",onReady);
  setTimeout(()=>{ v.removeEventListener("loadeddata",onReady); resolve(); },1500); // don't hang forever

}
function drawMobilePipFrame(){

 const c=mobilePipCtx, w=mobilePipCanvas.width, h=mobilePipCanvas.height;
 const g=c.createLinearGradient(0,0,w,h);
 g.addColorStop(0,"#241d63"); g.addColorStop(1,"#5146d8");
 c.fillStyle=g; c.fillRect(0,0,w,h);
 const item=qi>-1?QUEUE[qi]:null;
 if(!item){
  c.fillStyle="#fff"; c.font="600 26px Inter,sans-serif"; c.textBaseline="middle";
  c.fillText(I18N[uiLang].nothingQueued,24,h/2);
  return;
 }
 const r=REC.get(item.id);
 c.fillStyle="rgba(255,255,255,.7)"; c.font="700 14px Inter,sans-serif";
 c.fillText("PART "+r.Part,24,34);
 c.fillStyle="#fff"; c.font="600 30px Georgia,serif";
 c.fillText(item.book+" "+item.chapter,24,78);
 c.fillStyle="rgba(255,255,255,.85)"; c.font="500 16px Inter,sans-serif";
 c.fillText(r.Event,24,112,w-48);
 // play/pause glyph
 c.fillStyle="rgba(255,255,255,.9)";
 const cx=w-56, cy=h-56;
 c.beginPath(); c.arc(cx,cy,26,0,Math.PI*2); c.fillStyle="rgba(255,255,255,.16)"; c.fill();

  c.beginPath(); c.moveTo(cx-7,cy-11); c.lineTo(cx-7,cy+11); c.lineTo(cx+12,cy); c.closePath(); c.fill();

}
async function openMobilePip(){

function renderBookTimelinePanel(slug){
 if(!TIMELINE_BOOKS) return `<div class="book-tl-loading">Loading…</div>`;
 const book=TIMELINE_BOOKS.find(b=>b.name.toLowerCase().replace(/\s+/g,"-")===slug);
 if(!book) return `<div class="book-tl-loading">Couldn't load that book's timeline.</div>`;
 const span=book.spanStart===null?"undated":(book.spanStart===book.spanEnd?fmtYear(book.spanStart):fmtYear(book.spanStart)+" – "+fmtYear(book.spanEnd));
 const written=book.writtenStart===book.writtenEnd?fmtYear(book.writtenStart):fmtYear(book.writtenStart)+" – "+fmtYear(book.writtenEnd);

 const dated=book.events.filter(ev=>ev[4]!==null&&ev[4]!==undefined);
 let axisHtml="", lo=0, hi=1;
 if(dated.length){
  const starts=dated.map(ev=>ev[4]);
  const ends=dated.map(ev=>ev[5]!==null&&ev[5]!==undefined?ev[5]:ev[4]);
  const rawLo=Math.min(...starts), rawHi=Math.max(...ends);
  const range=Math.max(rawHi-rawLo,1);

 }
 const pct=y=>Math.min(100,Math.max(0,((y-lo)/(hi-lo))*100));

 const rows=book.events.map(ev=>{
  const [name,,startDisp,endDisp,ss,es]=ev;
  if(ss===null||ss===undefined){

   return `<div class="book-tl-row">

    <div class="book-tl-track"><span class="book-tl-chip">undated</span></div>
   </div>`;
  }
  const left=pct(ss), right=pct(es!==null&&es!==undefined?es:ss);
  const width=Math.max(right-left,1.5);

  return `<div class="book-tl-row">
   <div class="book-tl-row-head"><span class="book-tl-name">${esc(name)}</span><span class="book-tl-date">${esc(dateTxt)}</span></div>
   <div class="book-tl-track"><div class="book-tl-bar" style="left:${left}%;width:${width}%"></div></div>
  </div>`;
 }).join("");

 return `<div class="book-tl-meta">Narrative: ${esc(span)} · Written: ${esc(written)}</div>${axisHtml}${rows}`;
}

function visible(){

 const a=DATA.filter(r=>(!p||r.Period===p)&&(!q||HAY.get(r["#"]).includes(q))&&CH.get(r["#"]).length);
 const n=(x,y)=>Number(x["#"])-Number(y["#"]);
 if(mode==="part") a.sort((x,y)=>Number(x.Part)-Number(y.Part)||n(x,y));
 else if(mode==="title") a.sort((x,y)=>x["Part-Title"].localeCompare(y["Part-Title"])||n(x,y));
 else if(mode==="book") a.sort((x,y)=>BOOK.get(x["#"]).localeCompare(BOOK.get(y["#"]))||n(x,y));
 else if(mode==="canon") a.sort((x,y)=>BOOK_ORDER.get(x["#"])-BOOK_ORDER.get(y["#"])||n(x,y));
 else if(mode==="date") a.sort((x,y)=>x.Date.localeCompare(y.Date)||n(x,y));

function chapterCompletion(id,total){
 let done=0;
 for(let c=1;c<=total;c++){
  const chs=CH.get(id);

  if(progress.completed[chapKey(id,ch.chapter)]) done++;

}
function buildQueue(){

 list.forEach(r=>{

  chs.forEach((c,i)=>QUEUE.push({id:r["#"],chapter:c.chapter,book:c.book,bookNum:c.bookNum,url:c.url,page:c.page,pos:i+1,of:chs.length}));
 });

 let html="", prevBook=null;

 if(grouped){

  list.forEach(r=>{
   const b=BOOK.get(r["#"]); const chs=CH.get(r["#"]);
   totalsByBook.set(b,(totalsByBook.get(b)||0)+chs.length);
   doneByBook.set(b,(doneByBook.get(b)||0)+chapterCompletion(r["#"],chs.length));
  });
  list.forEach(r=>{
   const b=BOOK.get(r["#"]), chs=CH.get(r["#"]);
   if(b!==prevBook){
    prevBook=b;

   }
   html+=`<button class="q" data-id="${esc(r["#"])}">

/* volume knob: same rotary drag/scroll widget as the pop-out, scaled for the inline control */
(function initVolKnob(){
 const wrap=$("volWrap"), dialWrap=$("volDialWrap");
 for(let i=0;i<VOL_TICKS;i++){
  const t=document.createElement("div");

  t.style.transform="rotate("+(VOL_MIN_DEG+i*((VOL_MAX_DEG-VOL_MIN_DEG)/(VOL_TICKS-1)))+"deg)";

 function applyFromAngle(deg){
  const v=Math.min(1,Math.max(0,(deg-VOL_MIN_DEG)/(VOL_MAX_DEG-VOL_MIN_DEG)));

  const cx=box.left+box.width/2, cy=box.top+box.height/2;

});

function endSeek(e){

barEl.addEventListener("pointercancel",endSeek);

});
function syncStickyPlayer(){
 const item=qi>-1?QUEUE[qi]:null;
 if(!item){
  $("spTitle").textContent=I18N[uiLang].nothingQueued;
  $("spSub").textContent="";
  return;
 }
 const r=REC.get(item.id);
 $("spTitle").textContent=`${item.book} ${item.chapter}`;
 $("spSub").textContent=r.Event;
 $("spSwatch").style.background=coverFor(Number(r.Part));
}
audio.addEventListener("play",()=>{ $("spPlay").innerHTML=ICONS.pause; });
audio.addEventListener("pause",()=>{ $("spPlay").innerHTML=ICONS.play; });
audio.addEventListener("timeupdate",()=>{
 $("spFill").style.width=(audio.duration?(audio.currentTime/audio.duration)*100:0)+"%";
});
if("IntersectionObserver" in window){
 const stickyObs=new IntersectionObserver(entries=>{
  entries.forEach(en=>{ $("stickyPlayer").classList.toggle("show", !en.isIntersecting); });
 },{threshold:0});
 stickyObs.observe(document.querySelector(".player"));
} else {
 // Fallback for browsers without IntersectionObserver: plain scroll-position check.
 const playerEl=document.querySelector(".player");
 window.addEventListener("scroll",()=>{
  const r=playerEl.getBoundingClientRect();
  $("stickyPlayer").classList.toggle("show", r.bottom<0);
});
}

applyLang(uiLang);

// Resume where the person left off, if the browser remembers a chapter and there's a matching row.
(function resumeFromCache(){
 if(!progress.last) return;
 const i=QUEUE.findIndex(x=>x.id===progress.last.id&&x.chapter===progress.last.chapter);
 if(i<0) return;
 load(i,false);
 const t=progress.last.time||0;
 audio.addEventListener("loadedmetadata",()=>{ if(t>0&&t<(audio.duration||Infinity)) audio.currentTime=t; },{once:true});
})();
</script>
