<title>Bible Chronology — Listening Console</title>
<!--
  Player layout inspired by Muhammed Erdem's "Mini Music Player" pen
  (codepen.io/JavaScriptJunkie/pen/qBWrRyg), itself based on a Dribbble
  design by Voicu Apostol. Written from scratch here — no code reused.
  Audio: Sajeeva Vahini Telugu Audio Bible.
-->
<style>
:root{
 --bg:#e6eaf2; --panel:#f4f7fb; --surface:#fff;
 --ink:#1d2536; --muted:#71829e; --line:#dde4ee;
 --accent:#5146d8; --accent-dark:#4038c4; --accent-ring:#b9b6ec; --soft:#eceaff; --soft-ink:#443db5;
 --sans:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
 --lift:0 18px 40px -14px rgba(50,74,130,.42);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

.hero{position:relative;isolation:isolate;overflow:hidden;color:#fff;
 background:linear-gradient(118deg,#241d63 0%,#3d33a8 38%,#5146d8 68%,#7a6ce6 100%)}
.hero::before{content:"";position:absolute;inset:-70% -15% auto;height:420px;z-index:-1;
 background:radial-gradient(52% 58% at 26% 100%,rgba(255,255,255,.26),transparent 68%)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:96px;pointer-events:none;
 background:linear-gradient(180deg,rgba(230,234,242,0) 0%,rgba(230,234,242,.55) 58%,var(--bg) 100%)}
.hero-inner{max-width:1320px;margin:auto;padding:40px 24px 62px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.hero-mark{flex:0 0 auto;width:52px;height:52px;display:grid;place-items:center;border-radius:15px;
 background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(6px)}
.hero-mark svg{width:27px;height:27px}
.hero-text{min-width:0}
.hero h1{margin:0;font-family:var(--serif);font-weight:600;font-size:clamp(28px,4.4vw,40px);
 line-height:1.04;letter-spacing:-.022em}
.hero p{margin:7px 0 0;font-size:13.5px;line-height:1.5;color:rgba(255,255,255,.76);max-width:46ch}
.hero-nav{margin-left:auto;flex:0 0 auto}
.hero-nav a{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:#fff;text-decoration:none;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.32);border-radius:99px;padding:9px 15px;backdrop-filter:blur(6px);transition:background .2s,transform .2s;white-space:nowrap}
.hero-nav a:hover{background:rgba(255,255,255,.24);transform:translateY(-1px)}

.app{max-width:1320px;margin:auto;padding:4px 24px 56px;display:grid;grid-template-columns:392px minmax(0,1fr);gap:26px;align-items:start}

/* ---------- console ---------- */
.console{position:sticky;top:18px;display:flex;flex-direction:column;gap:14px}
.player{background:var(--panel);border-radius:20px;padding:26px 26px 22px;box-shadow:var(--lift)}
.player-top{display:flex;align-items:flex-start;gap:16px}

.cover{position:relative;width:216px;height:216px;flex:0 0 auto;margin-left:-58px;border-radius:16px}
.cover::before{content:"";position:absolute;inset:0;border-radius:16px;background:var(--cover,linear-gradient(140deg,#4036a8,#7b6fe0));transform:translateY(20px) scale(.9);filter:blur(13px);opacity:.75}
.cover-art{position:absolute;inset:0;border-radius:16px;background:var(--cover,linear-gradient(140deg,#4036a8,#7b6fe0));color:#fff;padding:18px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 10px 30px -8px rgba(53,44,124,.55);transition:opacity .34s ease,transform .34s ease}
.cover-art.swap{opacity:0;transform:scale(.94)}
.cover-part{font-size:10px;font-weight:700;letter-spacing:.16em;opacity:.78}
.cover-book{font-family:var(--serif);font-size:23px;line-height:1.15;text-shadow:0 2px 10px rgba(30,22,80,.35)}
.cover-ch{font-family:var(--serif);font-size:58px;line-height:.95;letter-spacing:-.02em}
.cover-ch small{font-size:15px;opacity:.75;letter-spacing:.04em}

.rail{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding-left:4px}
.rail button{position:relative;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:#a8b3c9;font-size:17px;transition:color .25s,background .25s,transform .25s}
.rail button:hover{color:var(--accent);background:var(--surface);box-shadow:0 6px 14px -6px rgba(76,70,124,.35)}
.rail button.on{color:var(--accent);background:var(--soft)}
.rail .big{width:78px;height:78px;margin-top:4px;font-size:34px;color:#fff;background:var(--accent);box-shadow:0 14px 26px -8px rgba(81,70,216,.75)}
.rail .big:hover{background:var(--accent-dark);color:#fff;transform:translateY(-1px)}

.now{margin-top:20px;display:flex;align-items:flex-end;gap:14px}
.now-text{flex:1;min-width:0}
.now-event{font-family:var(--serif);font-size:19px;line-height:1.3;margin-bottom:5px}
.now-sub{font-size:13px;color:var(--muted);line-height:1.4}
.now-dur{font-size:17px;font-weight:700;color:var(--muted);opacity:.6;font-variant-numeric:tabular-nums}

.bar{margin-top:14px;height:7px;border-radius:99px;background:#d4dcea;cursor:pointer;position:relative;touch-action:none}
.bar-fill{height:100%;width:0;border-radius:99px;background:var(--accent);position:relative}
.bar-fill::after{content:"";position:absolute;right:-6px;top:50%;width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid var(--accent);transform:translateY(-50%);box-shadow:0 2px 6px rgba(40,50,90,.3);transition:transform .15s,width .15s,height .15s}
.bar.dragging .bar-fill::after{width:17px;height:17px;right:-8px;transform:translateY(-50%) scale(1.05)}
.bar-foot{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar-tools{display:flex;gap:6px}
.chip-speed{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 9px;font-size:11px;font-weight:600;color:var(--ink);cursor:pointer}
.upnext{margin-top:14px;padding-top:13px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.45}
.upnext b{color:var(--ink);font-weight:650}
.err{margin-top:10px;font-size:12px;color:#b42318}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 13px}
.stat b{display:block;font-size:17px;letter-spacing:-.3px}
.stat span{font-size:11px;color:var(--muted)}

/* ---------- library ---------- */
.library{min-width:0}
.tools{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.tools input,.tools select{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px 13px}
.tools input{flex:1;min-width:190px}
.tools input:hover,.tools select:hover{border-color:var(--accent-ring)}
.count{font-size:13px;color:var(--muted);margin:0 0 12px}
.count b{color:var(--ink)}

.queue{display:flex;flex-direction:column;gap:7px}
.q{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:13px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:3px solid transparent;border-radius:14px;padding:12px 14px;transition:border-color .18s,transform .18s}
.q:hover{border-color:var(--accent-ring)}
.q-num{font-size:12px;font-weight:700;color:#a3aec2;font-variant-numeric:tabular-nums}
.q-title{font-family:var(--serif);font-size:15px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q-meta{font-size:12px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q-go{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:var(--accent);background:var(--soft)}
.q.playing{border-left-color:var(--accent);background:linear-gradient(90deg,var(--soft),var(--surface) 55%)}
.q.playing .q-num{color:var(--accent)}
.q.playing .q-go{background:var(--accent);color:#fff}
.none{display:none;padding:56px;text-align:center;color:var(--muted)}

@media(max-width:1000px){
 .app{grid-template-columns:1fr;gap:20px;padding:4px 14px 48px}
 .hero-inner{padding:30px 14px 52px;gap:14px}
 .hero-mark{width:44px;height:44px;border-radius:13px}
 .hero-mark svg{width:23px;height:23px}
 .console{position:static}
 .player{padding:20px}
 .player-top{flex-wrap:wrap;justify-content:center}
 .cover{margin:-52px auto 14px;width:190px;height:190px}
 .rail{flex-direction:row;width:100%;padding-left:0;gap:6px}
 .rail .big{margin-top:0;margin-left:auto;width:66px;height:66px;font-size:28px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>

<div class="app">

   <div class="now">

    <div class="bar-tools">

     </select>

   </div>
   <div class="upnext" id="upnext">Up next — nothing queued</div>
   <div class="err" id="err" hidden></div>
  </section>

  <div class="stats">

   <div class="stat"><b id="statCh">0</b><span>chapters</span></div>
   <div class="stat"><b id="statPos">—</b><span>position</span></div>
  </div>
 </aside>

 <main class="library">
  <div class="tools">
   <input id="search" type="search" placeholder="Search event, reference, date…">
   <select id="period"><option value="">All periods</option><option>Old Testament</option><option>New Testament</option></select>
   <select id="sort">
    <option value="chron">Chronological order</option>
    <option value="part">By Part</option>
    <option value="title">By Part-Title</option>
    <option value="book">By Bible book</option>
    <option value="date">By Date</option>
   </select>
  </div>
  <p class="count"><b id="count">0 events</b> · <span id="countCh">0 chapters</span> in the queue</p>
  <div class="queue" id="queue"></div>
  <div class="none" id="none">No matching events.</div>
 </main>
</div>

 "Source": "https://www.sajeevavahini.com/bible/telugu-bible-bsi/hebrews/1 | https://www.sajeevavahini.com/bible/telugu-bible-bsi/hebrews/2 | https://www.sajeevavahini.com/bible/telugu-bible-bsi/hebrews/3 | https://www.sajeevavahini.com/bible/telugu-bible-bsi/hebrews/4 | https://www.sajeevavahini.com/bible/telugu-bible-bsi/hebrews/5 | https://www.sajeevavahini.com/bible/telugu-bible-bsi/hebrews/6 | https://www.sajeevavahini.com/bible/telugu-bible-bsi/hebrews/7 | https://www.sajeevavahini.com/bible/telugu-bible-bsi/hebrews/8 | https://www.sajeevavahini.com/bible/telugu-bible-bsi/hebrews/9 | https://www.sajeevavahini.com/bible/telugu-bible-bsi/hebrews/10 | https://www.sajeevavahini.com/bible/telugu-bible-bsi/hebrews/11 | https://www.sajeevavahini.com/bible/telugu-bible-bsi/hebrews/12 | https://www.sajeevavahini.com/bible/telugu-bible-bsi/hebrews/13"}, {"#": "232", "Date": "68 AD", "Period": "New Testament", "Part": "10", "Part-Title": "Paul & Apostolic Letters", "Event": "Jude Writes his Letter", "Reference": "Jude 1", "Source": "https://www.sajeevavahini.com/bible/telugu-bible-bsi/jude/1"}, {"#": "233", "Date": "90 AD", "Period": "New Testament", "Part": "10", "Part-Title": "Paul & Apostolic Letters", "Event": "John Writes his First Letter", "Reference": "1 John 1 – 5", "Source": "https://www.sajeevavahini.com/bible/telugu-bible-bsi/1-john/1 | https://www.sajeevavahini.com/bible/telugu-bible-bsi/1-john/2 | https://www.sajeevavahini.com/bible/telugu-bible-bsi/1-john/3 | https://www.sajeevavahini.com/bible/telugu-bible-bsi/1-john/4 | https://www.sajeevavahini.com/bible/telugu-bible-bsi/1-john/5"}, {"#": "234", "Date": "92 AD", "Period": "New Testament", "Part": "10", "Part-Title": "Paul & Apostolic Letters", "Event": "John Writes his Second Letter", "Reference": "2 John 1", "Source": "https://www.sajeevavahini.com/bible/telugu-bible-bsi/2-john/1"}, {"#": "235", "Date": "94 AD", "Period": "New Testament", "Part": "10", "Part-Title": "Paul & Apostolic Letters", "Event": "John Writes his Third Letter", "Reference": "3 John 1", "Source": "https://www.sajeevavahini.com/bible/telugu-bible-bsi/3-john/1"}, {"#": "236", "Date": "95 AD", "Period": "New Testament", "Part": "10", "Part-Title": "Paul & Apostolic Letters", "Event": "John’s Revelation on Patmos", "Reference": "Revelation 1 – 22", "Source": "https://www.sajeevavahini.com/bible/telugu-bible-bsi/revelation/1 | https://www.sajeevavahini.com/bible/telugu-bible-bsi/revelation/2 | https://www.sajeevavahini.com/bible/telugu-bible-bsi/revelation/3 | https://www.sajeevavahini.com/bible/telugu-bible-bsi/revelation/4 | https://www.sajeevavahini.com/bible/telugu-bible-bsi/revelation/5 | https://www.sajeevavahini.com/bible/telugu-bible-bsi/revelation/6 | https://www.sajeevavahini.com/bible/telugu-bible-bsi/revelation/7 | https://www.sajeevavahini.com/bible/telugu-bible-bsi/revelation/8 | https://www.sajeevavahini.com/bible/telugu-bible-bsi/revelation/9 | https://www.sajeevavahini.com/bible/telugu-bible-bsi/revelation/10 | https://www.sajeevavahini.com/bible/telugu-bible-bsi/revelation/11 | https://www.sajeevavahini.com/bible/telugu-bible-bsi/revelation/12 | https://www.sajeevavahini.com/bible/telugu-bible-bsi/revelation/13 | https://www.sajeevavahini.com/bible/telugu-bible-bsi/revelation/14 | https://www.sajeevavahini.com/bible/telugu-bible-bsi/revelation/15 | https://www.sajeevavahini.com/bible/telugu-bible-bsi/revelation/16 | https://www.sajeevavahini.com/bible/telugu-bible-bsi/revelation/17 | https://www.sajeevavahini.com/bible/telugu-bible-bsi/revelation/18 | https://www.sajeevavahini.com/bible/telugu-bible-bsi/revelation/19 | https://www.sajeevavahini.com/bible/telugu-bible-bsi/revelation/20 | https://www.sajeevavahini.com/bible/telugu-bible-bsi/revelation/21 | https://www.sajeevavahini.com/bible/telugu-bible-bsi/revelation/22"}];

const AUDIO_BASE="https://hadassahstore.sajeevavahini.com/audiobible/";
const BOOK_NUM={
 genesis:1,exodus:2,leviticus:3,numbers:4,deuteronomy:5,joshua:6,judges:7,ruth:8,
 "1-samuel":9,"2-samuel":10,"1-kings":11,"2-kings":12,"1-chronicles":13,"2-chronicles":14,
 ezra:15,nehemiah:16,esther:17,job:18,psalms:19,proverbs:20,ecclesiastes:21,"song-of-solomon":22,
 isaiah:23,jeremiah:24,lamentations:25,ezekiel:26,daniel:27,hosea:28,joel:29,amos:30,obadiah:31,
 jonah:32,micah:33,nahum:34,habakkuk:35,zephaniah:36,haggai:37,zechariah:38,malachi:39,
 matthew:40,mark:41,luke:42,john:43,acts:44,romans:45,"1-corinthians":46,"2-corinthians":47,
 galatians:48,ephesians:49,philippians:50,colossians:51,"1-thessalonians":52,"2-thessalonians":53,
 "1-timothy":54,"2-timothy":55,titus:56,philemon:57,hebrews:58,james:59,"1-peter":60,"2-peter":61,
 "1-john":62,"2-john":63,"3-john":64,jude:65,revelation:66
};
const TITLE_CASE=s=>s.split("-").map(w=>w[0].toUpperCase()+w.slice(1)).join(" ");

// ESV/NLT mp3 filenames follow "{bookNum:2digits}_{abbr}_{chapter:3digits}.mp3" on content.swncdn.com.
// Abbreviation table confirmed against Bible Study Tools' official book-code list.
const ESV_NLT_ABBR={
 1:"ge",2:"ex",3:"le",4:"nu",5:"de",6:"jos",7:"jud",8:"ru",
 9:"1sa",10:"2sa",11:"1ki",12:"2ki",13:"1ch",14:"2ch",
 15:"ezr",16:"ne",17:"est",18:"job",19:"ps",20:"pr",21:"ec",22:"so",
 23:"isa",24:"jer",25:"la",26:"eze",27:"da",28:"ho",29:"joe",30:"am",31:"ob",
 32:"jon",33:"mic",34:"na",35:"hab",36:"zep",37:"hag",38:"zec",39:"mal",
 40:"mt",41:"mr",42:"lu",43:"joh",44:"ac",45:"ro",46:"1co",47:"2co",
 48:"ga",49:"eph",50:"php",51:"col",52:"1th",53:"2th",
 54:"1ti",55:"2ti",56:"tit",57:"phm",58:"he",59:"jas",60:"1pe",61:"2pe",
 62:"1jo",63:"2jo",64:"3jo",65:"jude",66:"re"
};
const pad2=n=>String(n).padStart(2,"0");
const pad3=n=>String(n).padStart(3,"0");

// One version-config object per audio source. Only Telugu (the original) and the Hindi/ESV/NLT
// filename patterns confirmed by the user are wired up here.
const VERSIONS={
 telugu:{label:"Telugu",url:it=>AUDIO_BASE+it.bookNum+"/"+it.chapter+".mp3"},
 hindi: {label:"Hindi", url:it=>"https://www.wordproaudio.net/bibles/app/audio/3/"+it.bookNum+"/"+it.chapter+".mp3"},
 esv:   {label:"ESV (English)",url:it=>"https://content.swncdn.com/biblestudytools/audio/esv-mp3/"+pad2(it.bookNum)+"_"+ESV_NLT_ABBR[it.bookNum]+"_"+pad3(it.chapter)+".mp3"},
 nlt:   {label:"NLT (English)",url:it=>"https://content.swncdn.com/biblestudytools/audio/nlt-mp3/"+pad2(it.bookNum)+"_"+ESV_NLT_ABBR[it.bookNum]+"_"+pad3(it.chapter)+".mp3"}
};
let currentVersion="telugu";

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clock=s=>Number.isFinite(s)?Math.floor(Math.max(0,s)/60)+":"+String(Math.floor(Math.max(0,s))%60).padStart(2,"0"):"--:--";
const sourcesOf=r=>(r.Source||"").split(" | ").filter(Boolean);

// Each source URL carries its own book + chapter, so the MP3 path is derivable.
function chaptersOf(r){
 return sourcesOf(r).map(src=>{
  const m=src.match(/sajeevavahini\.com\/bible\/[^/]+\/([^/]+)\/(\d+)\/?$/i);
  if(!m) return null;
  const slug=m[1].toLowerCase(), n=BOOK_NUM[slug];
  if(!n) return null;
  const chapter=Number(m[2]);
  return {chapter,book:TITLE_CASE(slug),bookNum:n,url:AUDIO_BASE+n+"/"+chapter+".mp3",page:src};
 }).filter(Boolean);
}
const CH=new Map(DATA.map(r=>[r["#"],chaptersOf(r)]));
const REC=new Map(DATA.map(r=>[r["#"],r]));
const BOOK=new Map(DATA.map(r=>[r["#"],(r.Reference.match(/^((?:[1-3] )?[A-Za-z]+(?: [A-Za-z]+)?)/)||["",""])[1]]));
const HAY=new Map(DATA.map(r=>[r["#"],[r.Date,r.Period,r["Part-Title"],r.Event,r.Reference].join(" ").toLowerCase()]));
const coverFor=part=>`linear-gradient(140deg,hsl(247 62% ${28+part*1.7}%),hsl(256 58% ${52+part*1.1}%))`;

const play=()=>{const p=audio.play();if(p&&typeof p.catch==="function")p.catch(()=>{})};
const audio=new Audio();
audio.referrerPolicy="no-referrer";
audio.preload="metadata";
let QUEUE=[];        // one entry per chapter, flattened across the visible events
let qi=-1;           // index into QUEUE
let continuous=true;

/* ---------------- list + queue ---------------- */
function visible(){
 const q=$("search").value.trim().toLowerCase(), p=$("period").value, mode=$("sort").value;
 const a=DATA.filter(r=>(!p||r.Period===p)&&(!q||HAY.get(r["#"]).includes(q))&&CH.get(r["#"]).length);
 const n=(x,y)=>Number(x["#"])-Number(y["#"]);
 if(mode==="part") a.sort((x,y)=>Number(x.Part)-Number(y.Part)||n(x,y));
 else if(mode==="title") a.sort((x,y)=>x["Part-Title"].localeCompare(y["Part-Title"])||n(x,y));
 else if(mode==="book") a.sort((x,y)=>BOOK.get(x["#"]).localeCompare(BOOK.get(y["#"]))||n(x,y));
 else if(mode==="date") a.sort((x,y)=>x.Date.localeCompare(y.Date)||n(x,y));
 else a.sort(n);
 return a;
}

function buildQueue(){
 const keep=qi>-1?QUEUE[qi]:null;
 const list=visible();
 QUEUE=[];
 list.forEach(r=>{
  const chs=CH.get(r["#"]);
  chs.forEach((c,i)=>QUEUE.push({id:r["#"],chapter:c.chapter,book:c.book,bookNum:c.bookNum,url:c.url,page:c.page,pos:i+1,of:chs.length}));
 });

 $("queue").innerHTML=list.map(r=>{
  const chs=CH.get(r["#"]);
  return `<button class="q" data-id="${esc(r["#"])}">
   <span class="q-num">#${esc(r["#"])}</span>
   <span>
    <span class="q-title">${esc(r.Event)}</span>
    <span class="q-meta">${esc(r.Reference)} · ${chs.length} chapter${chs.length===1?"":"s"} · ${esc(r.Date)}</span>
   </span>
   <span class="q-go">▶</span>
  </button>`;
 }).join("");
 $("count").textContent=list.length+(list.length===1?" event":" events");
 $("countCh").textContent=QUEUE.length+" chapters";
 $("statEvents").textContent=list.length;
 $("statCh").textContent=QUEUE.length;
 $("none").style.display=list.length?"none":"block";

 // Hold position if the playing chapter survived the new filter.
 if(keep){
  const i=QUEUE.findIndex(x=>x.id===keep.id&&x.chapter===keep.chapter);
  if(i>-1){qi=i} else {audio.pause();qi=-1}
 }
 paintNow();
}

/* ---------------- player ---------------- */
function load(i,autoplay){
 if(i<0||i>=QUEUE.length) return;
 qi=i;
 const item=QUEUE[i], r=REC.get(item.id);
 const art=$("coverArt");
 art.classList.add("swap");
 setTimeout(()=>{
  $("cover").style.setProperty("--cover",coverFor(Number(r.Part)));
  $("coverPart").textContent="PART "+r.Part;
  $("coverBook").textContent=item.book;
  $("coverCh").innerHTML=item.chapter+(item.of>1?` <small>of ${item.of}</small>`:"");
  art.classList.remove("swap");
 },170);

 $("err").hidden=true;
 $("barFill").style.width="0%";$("nowTime").textContent="0:00";$("nowDur").textContent="--:--";
 audio.src=VERSIONS[currentVersion].url(item);audio.load();
 if(autoplay!==false) play();
 paintNow();
}

function paintNow(){
 const item=qi>-1?QUEUE[qi]:null;
 document.querySelectorAll(".q.playing").forEach(el=>el.classList.remove("playing"));
 if(!item){
  $("nowEvent").textContent="Nothing queued";
  $("nowSub").textContent="Pick an event from the list";
  $("upnext").textContent="Up next — nothing queued";
  $("statPos").textContent="—";
  return;
 }
 const r=REC.get(item.id);
 $("nowEvent").textContent=r.Event;
 $("nowSub").textContent=`${item.book} ${item.chapter} · chapter ${item.pos} of ${item.of} · ${r["Part-Title"]}`;
 $("statPos").textContent=`${qi+1}/${QUEUE.length}`;
 const nxt=QUEUE[qi+1];
 $("upnext").innerHTML=nxt
  ? `Up next — <b>${esc(REC.get(nxt.id).Event)}</b> · ${esc(nxt.book)} ${nxt.chapter}`
  : "End of the queue";
 const row=$("queue").querySelector(`.q[data-id="${item.id}"]`);
 if(row) row.classList.add("playing");
 if("mediaSession" in navigator){
  navigator.mediaSession.metadata=new MediaMetadata({title:`${item.book} ${item.chapter}`,artist:r.Event,album:"Part "+r.Part+" · "+r["Part-Title"]});
 }
}

function step(d){
 const i=qi+d;
 if(i>=0&&i<QUEUE.length) load(i,true);
}

audio.addEventListener("loadedmetadata",()=>{$("nowDur").textContent=clock(audio.duration);audio.playbackRate=Number($("speed").value)});
audio.addEventListener("timeupdate",()=>{
 $("nowTime").textContent=clock(audio.currentTime);
 $("barFill").style.width=(audio.duration?(audio.currentTime/audio.duration)*100:0)+"%";
});
audio.addEventListener("play",()=>{$("btnPlay").textContent="❚❚";$("btnPlay").title="Pause";$("btnPlay").setAttribute("aria-label","Pause")});
audio.addEventListener("pause",()=>{$("btnPlay").textContent="▶";$("btnPlay").title="Play";$("btnPlay").setAttribute("aria-label","Play")});
audio.addEventListener("error",()=>{if(audio.src){$("err").textContent="That chapter wouldn't load. Check the connection and try again.";$("err").hidden=false}});
audio.addEventListener("ended",()=>{
 if(!continuous){
  const next=QUEUE[qi+1];
  if(next&&next.id===QUEUE[qi].id) load(qi+1,true);   // finish this event, then stop
  return;
 }
 step(1);
});

$("btnPlay").onclick=()=>{
 if(qi<0){load(0,true);return}
 audio.paused?play():audio.pause();
};
$("btnPrev").onclick=()=>step(-1);
$("btnNext").onclick=()=>step(1);
$("btnAuto").onclick=()=>{
 continuous=!continuous;
 $("btnAuto").classList.toggle("on",continuous);
 $("btnAuto").setAttribute("aria-pressed",String(continuous));
};
$("btnLink").onclick=()=>{
 const item=qi>-1?QUEUE[qi]:null;
 if(item) window.open(item.page,"_blank","noopener");
};
$("speed").onchange=()=>{audio.playbackRate=Number($("speed").value)};
$("version").addEventListener("change",()=>{
 currentVersion=$("version").value;
 if(qi>-1){
  const wasPlaying=!audio.paused;
  load(qi,wasPlaying);
 }
});

function seek(e){
 if(!audio.duration) return;
 const box=$("bar").getBoundingClientRect();
 const ratio=Math.min(1,Math.max(0,(e.clientX-box.left)/box.width));
 audio.currentTime=ratio*audio.duration;
 $("barFill").style.width=ratio*100+"%";
}
let seeking=false;
const barEl=$("bar");
barEl.addEventListener("pointerdown",e=>{
 seeking=true;
 barEl.classList.add("dragging");
 try{barEl.setPointerCapture(e.pointerId);}catch(_){}
 seek(e);
});
barEl.addEventListener("pointermove",e=>{ if(seeking) seek(e); });
function endSeek(e){
 if(!seeking) return;
 seeking=false;
 barEl.classList.remove("dragging");
 try{barEl.releasePointerCapture(e.pointerId);}catch(_){}
}
barEl.addEventListener("pointerup",endSeek);
barEl.addEventListener("pointercancel",endSeek);

$("queue").addEventListener("click",e=>{
 const row=e.target.closest(".q");
 if(!row) return;
 const i=QUEUE.findIndex(x=>x.id===row.dataset.id);
 if(i>-1) load(i,true);
});

["search","period","sort"].forEach(id=>{
 $(id).addEventListener(id==="search"?"input":"change",buildQueue);
});

document.addEventListener("keydown",e=>{
 if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
 if(e.code==="Space"){e.preventDefault();$("btnPlay").click()}
 else if(e.key==="ArrowRight") step(1);
 else if(e.key==="ArrowLeft") step(-1);
});

if("mediaSession" in navigator){
 navigator.mediaSession.setActionHandler("previoustrack",()=>step(-1));
 navigator.mediaSession.setActionHandler("nexttrack",()=>step(1));
}

buildQueue();
</script>
