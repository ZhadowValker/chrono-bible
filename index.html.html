<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bible Chronology — Exact Source Order</title>
<style>
:root {
 --bg:#f5f7fb; --surface:#fff; --text:#172033; --muted:#667085; --line:#e4e7ec;
 --accent:#5146d8; --accent2:#7c3aed; --soft:#f0efff; --shadow:0 5px 20px rgba(16,24,40,.07);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:50;background:rgba(245,247,251,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.header-inner{max-width:1500px;margin:auto;padding:16px 22px}
.title{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:13px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:22px}
h1{margin:0;font-size:24px;letter-spacing:-.3px} .subtitle{color:var(--muted);font-size:13px;margin-top:2px}
.toolbar{max-width:1500px;margin:auto;padding:10px 22px 14px;display:flex;gap:8px;flex-wrap:wrap}
input,select,button{font:inherit;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--text);padding:10px 12px}
input{flex:1;min-width:230px} button{cursor:pointer;font-weight:650} button.active{background:var(--accent);color:white;border-color:var(--accent)}
main{max-width:1500px;margin:auto;padding:20px 22px 60px}
.status{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:17px}
.status strong{color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:17px;min-height:195px;box-shadow:var(--shadow);cursor:pointer;transition:.15s;position:relative}
.card:hover{transform:translateY(-2px);border-color:#b9b6ec}
.card-num{position:absolute;right:15px;top:14px;font-size:12px;color:#98a2b3;font-weight:700}
.era{font-size:11px;text-transform:uppercase;letter-spacing:.45px;color:var(--muted);margin-bottom:7px}
.date{font-weight:800;font-size:13px;color:var(--accent);margin-bottom:7px}
.part{display:inline-block;background:var(--soft);color:#443db5;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:750;margin-bottom:9px}
.card-title{font-size:16px;font-weight:750;line-height:1.3;margin:0 34px 7px 0}
.event{color:#344054;margin:0 0 11px;line-height:1.4}
.ref{color:var(--accent);font-weight:750;font-size:14px}
.tap{font-size:11px;color:var(--muted);margin-top:12px}
.list{display:none;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:55px 110px 170px minmax(220px,1fr) 180px;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 13px;cursor:pointer}
.row:hover{border-color:#b9b6ec}
.small{font-size:12px;color:var(--muted)}
.empty{display:none;text-align:center;padding:70px;color:var(--muted)}
.overlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(9,13,28,.74);padding:12px;align-items:center;justify-content:center}
.modal{width:min(1120px,100%);height:min(850px,96vh);background:#fff;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 25px 80px rgba(0,0,0,.35)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;border-bottom:1px solid var(--line);gap:12px}
.modal-title{font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.close{font-size:20px;padding:5px 10px;background:#f2f4f7}
iframe{border:0;flex:1;width:100%;background:#fff}
@media(max-width:760px){
 .header-inner,.toolbar,main{padding-left:12px;padding-right:12px}
 h1{font-size:20px} .grid{grid-template-columns:1fr}
 .row{grid-template-columns:42px 1fr} .row>*:nth-child(n+3){grid-column:2}
 input{min-width:150px}
}
</style>
</head>
<body>
<header>
 <div class="header-inner">

 </div>
 <div class="toolbar">

   <option value="date">Group by Date</option>
  </select>
  <button id="tiles" class="active">▦ Tiles</button>
  <button id="list">☷ List</button>
 </div>
</header>
<main>
 <div class="status"><strong id="count">236 events</strong><span>•</span><span>Master order # is never changed</span></div>
 <section id="grid" class="grid"></section>
 <section id="listView" class="list"></section>
 <div id="empty" class="empty">No matching events.</div>
</main>

<div id="overlay" class="overlay">
 <div class="modal">
  <div class="modal-head"><div id="modalTitle" class="modal-title"></div><button id="close" class="close">×</button></div>
  <iframe id="frame" title="Sajeeva Vahini Bible source"></iframe>
 </div>
</div>

const $=id=>document.getElementById(id);
let view="tiles";

function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function firstSource(r){return (r.Source||"").split(" | ")[0]}
function book(r){let m=r.Reference.match(/^((?:[1-3] )?[A-Za-z]+(?: [A-Za-z]+)?)/);return m?m[1]:""}

function filtered(){
 const q=$("search").value.trim().toLowerCase(), p=$("period").value, s=$("sort").value;
 let a=DATA.filter(r=>(!p||r.Period===p)&&(!q||Object.values(r).join(" ").toLowerCase().includes(q)));
 if(s==="part") a.sort((a,b)=>Number(a.Part)-Number(b.Part)||Number(a["#"])-Number(b["#"]));
 else if(s==="title") a.sort((a,b)=>a["Part-Title"].localeCompare(b["Part-Title"])||Number(a["#"])-Number(b["#"]));
 else if(s==="book") a.sort((a,b)=>book(a).localeCompare(book(b))||Number(a["#"])-Number(b["#"]));
 else if(s==="date") a.sort((a,b)=>a.Date.localeCompare(b.Date)||Number(a["#"])-Number(b["#"]));
 else a.sort((a,b)=>Number(a["#"])-Number(b["#"]));
 return a;
}

function card(r){
 return `<article class="card" data-id="${esc(r["#"])}">
   <span class="card-num">#${esc(r["#"])}</span>
   <div class="era">${esc(r.Period)}</div>
   <div class="date">${esc(r.Date)}</div>
   <span class="part">Part ${esc(r.Part)} · ${esc(r["Part-Title"])}</span>
   <h2 class="card-title">${esc(r.Event)}</h2>
   <p class="event">${esc(r.Reference)}</p>
   <div class="ref">▶ ${esc(r.Reference)}</div>
   <div class="tap">Tap to open listening source</div>
 </article>`;
}
function row(r){
 return `<div class="row" data-id="${esc(r["#"])}">
   <b>#${esc(r["#"])}</b>
   <div class="small">${esc(r.Date)}</div>
   <div class="small">${esc(r.Period)}<br>Part ${esc(r.Part)}</div>
   <div><b>${esc(r.Event)}</b><br><span class="small">${esc(r["Part-Title"])}</span></div>
   <div class="ref">${esc(r.Reference)}</div>
 </div>`;
}
function openSource(r){
 const src=firstSource(r); if(!src) return;
 $("modalTitle").textContent=`#${r["#"]} · ${r.Date} · ${r.Reference}`;
 $("frame").src=src; $("overlay").style.display="flex"; document.body.style.overflow="hidden";
}
function closeSource(){$("frame").src="";$("overlay").style.display="none";document.body.style.overflow=""}

function render(){
 const a=filtered();
 $("count").textContent=a.length+" events";
 $("grid").innerHTML=a.map(card).join("");
 $("listView").innerHTML=a.map(row).join("");
 $("grid").style.display=view==="tiles"?"grid":"none";
 $("listView").style.display=view==="list"?"flex":"none";
 $("empty").style.display=a.length?"none":"block";
 document.querySelectorAll("[data-id]").forEach(el=>el.addEventListener("click",()=>openSource(DATA.find(r=>r["#"]===el.dataset.id))));
}
$("search").oninput=render; $("period").onchange=render; $("sort").onchange=render;
$("tiles").onclick=()=>{view="tiles";$("tiles").classList.add("active");$("list").classList.remove("active");render()};
$("list").onclick=()=>{view="list";$("list").classList.add("active");$("tiles").classList.remove("active");render()};
$("close").onclick=closeSource;
$("overlay").addEventListener("click",e=>{if(e.target===$("overlay"))closeSource()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSource()});
render();
</script>
