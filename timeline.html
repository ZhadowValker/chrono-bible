<title>Bible Timeline — Chronology Chart</title>
<!-- Colour and type tokens matched to chrono-bible (Bible Chronology — Listening Console) for a consistent family look. -->
<style>
:root{
  --bg:#e6eaf2; --panel:#f4f7fb; --surface:#fff;
  --ink:#1d2536; --muted:#71829e; --line:#dde4ee;
  --accent:#5146d8; --accent-dark:#4038c4; --accent-ring:#b9b6ec; --soft:#eceaff; --soft-ink:#443db5;
  --sans:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --lift:0 18px 40px -14px rgba(50,74,130,.42);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

.hero{position:relative;isolation:isolate;overflow:hidden;color:#fff;
  background:linear-gradient(118deg,#241d63 0%,#3d33a8 38%,#5146d8 68%,#7a6ce6 100%)}
.hero::before{content:"";position:absolute;inset:-70% -15% auto;height:420px;z-index:-1;
  background:radial-gradient(52% 58% at 26% 100%,rgba(255,255,255,.26),transparent 68%)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:70px;pointer-events:none;
  background:linear-gradient(180deg,rgba(230,234,242,0) 0%,rgba(230,234,242,.55) 58%,var(--bg) 100%)}
.hero-inner{max-width:1320px;margin:auto;padding:36px 24px 52px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hero-mark{flex:0 0 auto;width:48px;height:48px;display:grid;place-items:center;border-radius:14px;
  background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(6px)}
.hero-mark svg{width:25px;height:25px}
.hero-text{min-width:0}
.hero h1{margin:0;font-family:var(--serif);font-weight:600;font-size:clamp(26px,4vw,36px);
  line-height:1.06;letter-spacing:-.02em}
.hero p{margin:6px 0 0;font-size:13.5px;line-height:1.5;color:rgba(255,255,255,.76);max-width:48ch}
.hero-nav{margin-left:auto;flex:0 0 auto}
.hero-nav a{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:#fff;text-decoration:none;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.32);border-radius:99px;padding:9px 15px;backdrop-filter:blur(6px);transition:background .2s,transform .2s;white-space:nowrap}
.hero-nav a:hover{background:rgba(255,255,255,.24);transform:translateY(-1px)}
.badge{display:inline-block;font-size:11px;color:#fff;border:1px solid rgba(255,255,255,.5);
  border-radius:99px;padding:3px 10px;margin-left:8px;vertical-align:middle;font-family:var(--sans);font-weight:600}

.app{max-width:1320px;margin:auto;padding:4px 24px 56px}

.tools{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.tools label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.tools select{border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:12px;padding:10px 13px;font-size:13.5px;cursor:pointer}
.tools select:hover{border-color:var(--accent-ring)}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);
  display:grid;place-items:center;font-size:16px;color:#a8b3c9;cursor:pointer;transition:color .2s,background .2s,box-shadow .2s}
.iconbtn:hover{color:var(--accent);background:#fff;border-color:var(--accent-ring);box-shadow:0 6px 14px -6px rgba(76,70,124,.35)}
.spacer{flex:1}
.expand-all{font-size:12.5px;color:var(--accent-dark);background:var(--soft);border:1px solid var(--accent-ring);
  border-radius:99px;padding:8px 14px;cursor:pointer}
.expand-all:hover{background:#e0dcff}

.card{background:var(--surface);border-radius:20px;box-shadow:var(--lift);overflow:hidden}

.legend{display:flex;flex-wrap:wrap;gap:14px;padding:13px 18px;border-bottom:1px solid var(--line);
  background:var(--panel);font-size:12px;color:var(--muted)}
.legend-item{display:flex;align-items:center;gap:6px}
.swatch{width:10px;height:10px;border-radius:3px;flex-shrink:0}

.scroll-area{overflow-x:auto;overflow-y:hidden}
.timeline-inner{position:relative}

.axis-row{display:flex;position:sticky;top:0;z-index:3;background:var(--surface);border-bottom:1px solid var(--line)}
.axis-label-cell{position:sticky;left:0;z-index:4;width:168px;min-width:168px;background:var(--surface);
  border-right:1px solid var(--line)}
.axis-track{position:relative;flex:1;height:30px}
.tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font-size:10px;color:var(--muted);
  padding:8px 0 0 5px;white-space:nowrap;font-variant-numeric:tabular-nums}

.row{display:flex;align-items:stretch;border-bottom:1px solid var(--line);cursor:pointer;border-left:3px solid transparent}
.row:last-child{border-bottom:none}
.row:hover{background:linear-gradient(90deg,var(--soft),var(--surface) 65%)}
.row.expanded{border-left-color:var(--accent)}
.row.expanded .label-cell{color:var(--accent-dark);font-weight:700}
.row.child{cursor:default;background:var(--panel)}
.row.child:hover{background:var(--panel)}
.row.child:last-of-type{border-bottom:1px solid var(--line)}

.label-cell{position:sticky;left:0;z-index:2;width:165px;min-width:165px;background:var(--surface);
  padding:0 10px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;border-right:1px solid var(--line)}
.row.child .label-cell{background:var(--panel);font-size:11.5px;font-weight:500;color:var(--ink);
  padding-left:26px;line-height:1.25}
.chevron{width:12px;flex-shrink:0;font-size:10px;color:var(--muted);transition:transform .15s}
.row.expanded>.label-cell .chevron{transform:rotate(90deg);color:var(--accent)}
.group-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.track-cell{position:relative;flex:1;height:44px}
.row.child .track-cell{height:32px}

.span-bar{position:absolute;top:16px;height:12px;border-radius:6px;opacity:.85}
.written-marker{position:absolute;top:7px;width:12px;height:12px;transform:translateX(-6px) rotate(45deg);
  border:1.5px solid var(--surface)}
.written-range{position:absolute;top:11px;height:20px;border-radius:3px;
  background:repeating-linear-gradient(45deg,rgba(29,37,54,.55),rgba(29,37,54,.55) 3px,transparent 3px,transparent 6px)}

.d-bar{position:absolute;top:11px;height:9px;border-radius:5px;opacity:.8}
.d-marker{position:absolute;top:8px;width:10px;height:10px;transform:translateX(-5px) rotate(45deg);
  border:1.5px solid var(--panel)}
.d-range{position:absolute;top:9px;height:13px;border-radius:3px;
  background:repeating-linear-gradient(45deg,rgba(29,37,54,.5),rgba(29,37,54,.5) 3px,transparent 3px,transparent 6px)}
.d-chip{position:absolute;left:0;top:6px;font-size:10px;color:var(--muted);background:var(--surface);
  border:1px solid var(--line);border-radius:99px;padding:2px 8px}

.hint{font-size:12px;color:var(--muted);margin:12px 4px 0}

.tooltip{position:fixed;z-index:50;background:var(--accent-dark);color:#fff;padding:10px 12px;border-radius:10px;
  font-size:12px;line-height:1.45;pointer-events:none;opacity:0;transform:translateY(4px);
  transition:opacity .1s ease,transform .1s ease;max-width:230px;box-shadow:0 14px 30px -10px rgba(50,74,130,.55)}
.tooltip.visible{opacity:1;transform:translateY(0)}
.tooltip .tt-title{font-weight:700;margin-bottom:3px;font-size:12.5px;font-family:var(--serif)}
.tooltip .tt-line{color:rgba(255,255,255,.82)}

@media(max-width:760px){
  .app{padding:4px 14px 48px}
  .hero-inner{padding:28px 14px 44px}
  .label-cell,.axis-label-cell{width:120px;min-width:120px}
  .row.child .label-cell{padding-left:18px}
}
</style>

const MIN_YEAR = -2200, MAX_YEAR = 120;
let pxPerYear = 0.55;
const ZOOM_STEP = 1.4;

function yearToX(year){ return (year - MIN_YEAR) * pxPerYear; }
function fmtYear(y){ if (y < 0) return Math.abs(y) + " BC"; if (y === 0) return "AD 1"; return "AD " + y; }

let groupMode = "canonical";
let expanded = new Set();

function currentOrder(){
  const arr = [...BOOKS];
  if (groupMode === "canonical" || groupMode === "section") arr.sort((a,b)=>a.order-b.order);
  else if (groupMode === "chronological") arr.sort((a,b)=> (a.spanStart-b.spanStart) || (a.spanEnd-b.spanEnd) || (a.order-b.order));
  else if (groupMode === "testament") arr.sort((a,b)=> a.testament===b.testament ? a.order-b.order : (a.testament==="OT"?-1:1));
  else if (groupMode === "written") arr.sort((a,b)=>a.writtenStart-b.writtenStart);
  return arr;
}
function colorFor(book){ return groupMode === "testament" ? TESTAMENT_COLORS[book.testament] : SECTION_COLORS[book.section]; }

function renderLegend(){
  const legend = document.getElementById("legend"); legend.innerHTML = "";
  const entries = groupMode === "testament"
    ? [["Old Testament", TESTAMENT_COLORS.OT], ["New Testament", TESTAMENT_COLORS.NT]]
    : Object.entries(SECTION_COLORS).filter(([n]) => BOOKS.some(b => b.section === n));
  entries.forEach(([name, color]) => {
    const el = document.createElement("div"); el.className = "legend-item";
    el.innerHTML = `<span class="swatch" style="background:${color}"></span>${name}`;
    legend.appendChild(el);
  });
}
function renderAxis(){
  const track = document.getElementById("axisTrack");
  track.style.width = yearToX(MAX_YEAR) + "px"; track.innerHTML = "";
  const step = pxPerYear > 1.2 ? 100 : pxPerYear > 0.35 ? 200 : 400;
  for (let y = Math.ceil(MIN_YEAR/step)*step; y <= MAX_YEAR; y += step){
    const tick = document.createElement("div"); tick.className = "tick";
    tick.style.left = yearToX(y) + "px"; tick.textContent = fmtYear(y);
    track.appendChild(tick);
  }
}

function makeBookRow(book, totalWidth){
  const isOpen = expanded.has(book.name);
  const row = document.createElement("div");
  row.className = "row" + (isOpen ? " expanded" : "");
  row.dataset.order = book.order;

  const label = document.createElement("div"); label.className = "label-cell";
  label.innerHTML = `<span class="chevron">▸</span><span class="group-dot" style="background:${colorFor(book)}"></span>${book.name}`;
  row.appendChild(label);

  const track = document.createElement("div"); track.className = "track-cell"; track.style.width = totalWidth + "px";
  const barLeft = yearToX(book.spanStart), barWidth = Math.max(yearToX(book.spanEnd)-barLeft, 3);
  const bar = document.createElement("div"); bar.className = "span-bar";
  bar.style.left = barLeft+"px"; bar.style.width = barWidth+"px"; bar.style.background = colorFor(book);
  track.appendChild(bar);

  if (book.writtenStart === book.writtenEnd){
    const marker = document.createElement("div"); marker.className = "written-marker";
    marker.style.left = yearToX(book.writtenStart)+"px"; marker.style.background = colorFor(book);
    track.appendChild(marker);
  } else {
    const wLeft = yearToX(book.writtenStart), wWidth = Math.max(yearToX(book.writtenEnd)-wLeft, 3);
    const wr = document.createElement("div"); wr.className = "written-range";
    wr.style.left = wLeft+"px"; wr.style.width = wWidth+"px"; track.appendChild(wr);
    const flag = document.createElement("div"); flag.className = "written-marker";
    flag.style.left = wLeft+"px"; flag.style.background = colorFor(book); track.appendChild(flag);
  }
  row.appendChild(track);

  row.addEventListener("click", () => { toggleExpand(book.name); });
  row.addEventListener("mouseenter", e => showBookTooltip(e, book));
  row.addEventListener("mousemove", moveTooltip);
  row.addEventListener("mouseleave", hideTooltip);
  return row;
}

function makeEventRow(book, ev, totalWidth){
  const [name, type, startDisp, endDisp, ss, es, notes] = ev;
  const row = document.createElement("div"); row.className = "row child";

  const label = document.createElement("div"); label.className = "label-cell";
  label.innerHTML = name + (notes ? ` <span style="font-size:10px;color:var(--muted);font-style:italic">(${notes})</span>` : "");
  row.appendChild(label);

  const track = document.createElement("div"); track.className = "track-cell"; track.style.width = totalWidth + "px";
  if (ss === null){
    const chip = document.createElement("span"); chip.className = "d-chip"; chip.textContent = "undated";
    chip.style.left = yearToX(book.spanStart) + "px";
    track.appendChild(chip);
  } else if (ss === es){
    const m = document.createElement("div"); m.className = "d-marker";
    m.style.left = yearToX(ss) + "px"; m.style.background = colorFor(book);
    track.appendChild(m);
  } else {
    const left = yearToX(ss), width = Math.max(yearToX(es) - left, 2);
    const bar = document.createElement("div"); bar.className = "d-bar";
    bar.style.left = left+"px"; bar.style.width = width+"px"; bar.style.background = colorFor(book);
    track.appendChild(bar);
  }
  row.appendChild(track);

  row.addEventListener("mouseenter", e => showEventTooltip(e, book, ev));
  row.addEventListener("mousemove", moveTooltip);
  row.addEventListener("mouseleave", hideTooltip);
  return row;
}

function renderRows(){
  const rowsEl = document.getElementById("rows"); rowsEl.innerHTML = "";
  const totalWidth = yearToX(MAX_YEAR);
  currentOrder().forEach(book => {
    rowsEl.appendChild(makeBookRow(book, totalWidth));
    if (expanded.has(book.name)){
      book.events.forEach(ev => rowsEl.appendChild(makeEventRow(book, ev, totalWidth)));
    }
  });
}
function renderAll(){ renderLegend(); renderAxis(); renderRows(); }

function toggleExpand(name){
  if (expanded.has(name)) expanded.delete(name); else expanded.add(name);
  renderRows();
}

const tooltipEl = document.getElementById("tooltip");
function showBookTooltip(e, book){
  const w = book.writtenStart === book.writtenEnd ? fmtYear(book.writtenStart) : fmtYear(book.writtenStart)+" – "+fmtYear(book.writtenEnd);
  tooltipEl.innerHTML = `<div class="tt-title">${book.name}</div><div class="tt-line">${book.section} · ${book.testament}</div>` +
    `<div class="tt-line">Narrative: ${fmtYear(book.spanStart)} – ${fmtYear(book.spanEnd)}</div><div class="tt-line">Written: ${w}</div>` +
    `<div class="tt-line" style="margin-top:4px;opacity:.9">Click to ${expanded.has(book.name) ? "collapse" : "expand"}</div>`;
  tooltipEl.classList.add("visible"); moveTooltip(e);
}
function showEventTooltip(e, book, ev){
  const [name, , startDisp, endDisp, ss, es, notes] = ev;
  const dateStr = ss === null ? "Undated" : (ss === es ? startDisp : startDisp+" – "+endDisp);
  tooltipEl.innerHTML = `<div class="tt-title">${name}</div><div class="tt-line">${book.name}${notes ? " · "+notes : ""}</div>` +
    `<div class="tt-line">${dateStr}</div>`;
  tooltipEl.classList.add("visible"); moveTooltip(e);
}
function moveTooltip(e){
  const pad = 14; let x = e.clientX+pad, y = e.clientY+pad;
  const r = tooltipEl.getBoundingClientRect();
  if (x+r.width > window.innerWidth-8) x = e.clientX-r.width-pad;
  if (y+r.height > window.innerHeight-8) y = e.clientY-r.height-pad;
  tooltipEl.style.left = x+"px"; tooltipEl.style.top = y+"px";
}
function hideTooltip(){ tooltipEl.classList.remove("visible"); }

document.getElementById("groupBy").addEventListener("change", e => { groupMode = e.target.value; renderAll(); });
document.getElementById("zoomIn").addEventListener("click", () => { pxPerYear *= ZOOM_STEP; renderAll(); });
document.getElementById("zoomOut").addEventListener("click", () => { pxPerYear /= ZOOM_STEP; renderAll(); });

// Shift + mouse wheel scrolls the timeline horizontally (desktop only — see note below).
const scrollAreaEl = document.getElementById("scrollArea");
scrollAreaEl.addEventListener("wheel", (e) => {
  if (e.shiftKey) {
    e.preventDefault();
    scrollAreaEl.scrollLeft += e.deltaY;
  }
}, { passive: false });
document.getElementById("expandAll").addEventListener("click", () => {
  const allOpen = BOOKS.every(b => expanded.has(b.name));
  expanded = allOpen ? new Set() : new Set(BOOKS.map(b => b.name));
  document.getElementById("expandAll").textContent = allOpen ? "Expand all" : "Collapse all";
  renderRows();
});

renderAll();

// Deep link from the Listening Console: timeline.html?book=<slug> expands and scrolls to that book.
(function openBookFromLink(){
 const slug=new URLSearchParams(location.search).get("book");
 if(!slug) return;
 const book=BOOKS.find(b=>b.name.toLowerCase().replace(/\s+/g,"-")===slug);
 if(!book) return;
 expanded.add(book.name);
 renderRows();
 requestAnimationFrame(()=>requestAnimationFrame(()=>{
  const row=document.querySelector(`.row[data-order="${book.order}"]`);
  if(row){
   row.scrollIntoView({behavior:"smooth",block:"center"});
   row.style.transition="background-color .3s";
   row.style.backgroundColor="var(--soft)";
   setTimeout(()=>{ row.style.backgroundColor=""; },1600);
  }
 }));
})();
</script>
